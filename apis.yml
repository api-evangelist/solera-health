aid: solera-health
name: Solera Health
description: Solera Health is a Phoenix, Arizona based preventive-care benefits manager that acts as a
  single integration point between health plans, employers and a curated network of non-clinical digital
  health providers. Its HALO omni-condition management platform lets a payer or employer contract, configure,
  enroll and report across eight condition networks - weight management, diabetes prevention and management,
  hypertension, behavioral and mental health, musculoskeletal, tobacco cessation, women's health and digestive
  health - spanning 25+ partner point solutions including Calm, Headspace, Lyra Health, Sword Health,
  WeightWatchers and Dario Health, alongside customer contracted solutions Solera did not source. Solera
  operates an Azure API Management gateway on its own domain for those partner and payer integrations,
  but publishes no public developer portal, API reference or machine-readable contract.
