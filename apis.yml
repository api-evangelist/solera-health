apis:
- aid: solera-health:solera-health-integrations-api
  name: Solera Health Integrations API
  description: A live Azure API Management gateway operated by Solera Health on its own api.soleranetwork.com
    domain, used for payer, employer and digital-health-partner integrations into the HALO platform. Every
    anonymous request returns the Azure APIM "Resource not found" JSON envelope and the matching developer
    portal at solera-api-gateway.developer.azure-api.net still serves Azure's default unpublished-portal
    placeholder, so no operations, reference or machine-readable contract are publicly discoverable. Recorded
    here as a probed, credential-gated surface.
  humanURL: https://www.soleranetwork.com/halo-platform
  baseURL: https://api.soleranetwork.com
  tags:
